name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_reviewer
          POSTGRES_PASSWORD: ai_reviewer
          POSTGRES_DB: ai_reviewer
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U ai_reviewer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
        env:
          OPENAI_API_KEY: test-key
          GITHUB_TOKEN: test-token
          TEST_DATABASE_URL: postgresql://ai_reviewer:ai_reviewer@localhost:5442/ai_reviewer
