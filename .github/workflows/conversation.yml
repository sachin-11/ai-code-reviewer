name: AI Reviewer Conversation

on:
  pull_request_review_comment:
    types: [created]

concurrency:
  group: "conversation-${{ github.event.comment.id }}"
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  respond:
    runs-on: ubuntu-latest
    if: github.event.comment.in_reply_to_id != null
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt

      - name: Respond to reviewer comment
        run: python -m agent.conversation_main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          WORKSPACE: ${{ github.workspace }}
